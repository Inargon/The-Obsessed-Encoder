[project]
name = "predictability-trap"
version = "0.1.0"
description = "Reproductions for 'The Predictability Trap': the watermarked-training experiments on published self-supervised recipes"
readme = "README.md"
requires-python = "==3.12.*"
# Science-relevant packages are pinned exactly (the versions the reference runs and
# the fidelity anchors were produced with); see the README's version-fidelity section
# for the upstream-declared -> pinned mapping.
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "timm==1.0.27",
    "datasets==4.1.1",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "numpy==2.2.6",
    "pillow==11.3.0",
    "matplotlib==3.10.7",
    "plotly==6.9.0",
    "kaleido==1.3.0",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "pyyaml==6.0.3",
    "termcolor==3.2.0",
    "iopath==0.1.10",
    "torchmetrics==1.9.0",
    "scikit-learn==1.7.2",
    "tqdm==4.67.1",
    "wandb>=0.21",
    "huggingface-hub>=0.34",
    "gdown>=5.2",
    # The LeWM example's stack (world-model training + the PushT simulator);
    # science-relevant packages pinned to the versions its reference runs used.
    "stable-worldmodel==0.1.1",
    "stable-pretraining==0.1.8",
    "lightning==2.6.5",
    "gymnasium==1.3.0",
    "pymunk==7.3.0",
    "pygame==2.6.1",
    "shapely==2.1.2",
    "scipy==1.15.3",
    "moviepy==2.2.1",
    "h5py==3.16.0",
    "hdf5plugin>=5",
    "imageio[ffmpeg]>=2.34",
    "opencv-python-headless>=4.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# One environment spans common/ and all three examples; nothing here is an
# installable package — the examples run in place from the repo root.
package = false

[tool.pytest.ini_options]
# importlib mode: the two examples deliberately mirror each other's test file
# names (test_configs.py, test_smoke.py), which the default import mode rejects.
addopts = "--import-mode=importlib"
testpaths = ["common/tests", "lejepa/additional_files/tests", "dinov3/additional_files/tests", "leworldmodel/additional_files/tests"]
# "." for common/ and the lejepa example; "dinov3" so the vendored package and
# its additional_files import exactly as they do in the training subprocess.
pythonpath = [".", "dinov3"]
markers = [
    "gpu: end-to-end smokes that need a CUDA device (deselect with -m 'not gpu')",
]
