# Two control-grounded successors to the previously successful one-step IDM.
epochs: 10
eval_every_n_steps: 2000
pair_every_n_steps: 100
checkpoint_every_n_steps: 500
preview_episodes: 2

common_overrides:
  - data.dataset.name=pusht_expert_train.h5
  - +pixel_tag.mode=video
  - +pixel_tag.size=5

common_eval_overrides:
  - +eval.tag_mode=video
  - +eval.tag_size=5

arms:
  factorized_reachability:
    control:
      mode: factorized_reachability
      max_horizon: 1
      hidden_dim: 256
      inverse_weight: 1.0
      reachability_weight: 0.1
      temperature: 0.1
      context_dim: 32
      context_weight: 0.1
      static_leak_weight: 0.1
      dynamic_variance_target: 0.2
      dynamic_variance_weight: 1.0
      dynamic_covariance_weight: 0.01

  direct_reachability:
    control:
      mode: direct_reachability
      max_horizon: 1
      hidden_dim: 256
      inverse_weight: 1.0
      reachability_weight: 0.1
      temperature: 0.1

  multi_horizon_idm:
    control:
      mode: multi_horizon_idm
      max_horizon: 3
      hidden_dim: 256
      inverse_weight: 1.0

  masked_reachability:
    control:
      mode: masked_reachability
      max_horizon: 3
      hidden_dim: 256
      inverse_weight: 1.0
      cycle_weight: 0.5
      reachability_weight: 0.1
      mask_keep_prob: 0.5
      temperature: 0.1

  # Relation-core sweep. Unlike the first campaign, these arms reproduce the
  # historical MSID target (the complete action sequence, not its mean) and
  # change only the weight of absolute JEPA prediction. The shuffled-action
  # metrics test whether reachability actually consumes its action input.
  masked_sequence_pred1:
    overrides:
      - +loss.pred_weight=1.0
    control: &masked_sequence_control
      mode: masked_reachability
      max_horizon: 3
      hidden_dim: 256
      inverse_target: sequence
      inverse_weight: 1.0
      cycle_weight: 0.5
      reachability_weight: 0.1
      mask_keep_prob: 0.5
      temperature: 0.1
      action_shuffle_diagnostics: true

  masked_sequence_pred03:
    overrides:
      - +loss.pred_weight=0.3
    control:
      <<: *masked_sequence_control

  masked_sequence_pred05:
    overrides:
      - +loss.pred_weight=0.5
    control:
      <<: *masked_sequence_control

  masked_sequence_pred07:
    overrides:
      - +loss.pred_weight=0.7
    control:
      <<: *masked_sequence_control

  masked_sequence_pred0:
    overrides:
      - +loss.pred_weight=0.0
    control:
      <<: *masked_sequence_control
