# Two control-grounded successors to the previously successful one-step IDM.
epochs: 10
eval_every_n_steps: 2000
pair_every_n_steps: 100
checkpoint_every_n_steps: 500
preview_episodes: 2

common_overrides:
  - data.dataset.name=pusht_expert_train.h5
  - +pixel_tag.mode=video
  - +pixel_tag.size=5

common_eval_overrides:
  - +eval.tag_mode=video
  - +eval.tag_size=5

arms:
  factorized_reachability:
    control:
      mode: factorized_reachability
      max_horizon: 1
      hidden_dim: 256
      inverse_weight: 1.0
      reachability_weight: 0.1
      temperature: 0.1
      context_dim: 32
      context_weight: 0.1
      static_leak_weight: 0.1
      dynamic_variance_target: 0.2
      dynamic_variance_weight: 1.0
      dynamic_covariance_weight: 0.01

  direct_reachability:
    control:
      mode: direct_reachability
      max_horizon: 1
      hidden_dim: 256
      inverse_weight: 1.0
      reachability_weight: 0.1
      temperature: 0.1

  multi_horizon_idm:
    control:
      mode: multi_horizon_idm
      max_horizon: 3
      hidden_dim: 256
      inverse_weight: 1.0

  masked_reachability:
    control:
      mode: masked_reachability
      max_horizon: 3
      hidden_dim: 256
      inverse_weight: 1.0
      cycle_weight: 0.5
      reachability_weight: 0.1
      mask_keep_prob: 0.5
      temperature: 0.1

  # Relation-core sweep. Unlike the first campaign, these arms reproduce the
  # historical MSID target (the complete action sequence, not its mean) and
  # change only the weight of absolute JEPA prediction. The shuffled-action
  # metrics test whether reachability actually consumes its action input.
  masked_sequence_pred1:
    overrides:
      - +loss.pred_weight=1.0
    control: &masked_sequence_control
      mode: masked_reachability
      max_horizon: 3
      hidden_dim: 256
      inverse_target: sequence
      inverse_weight: 1.0
      cycle_weight: 0.5
      reachability_weight: 0.1
      mask_keep_prob: 0.5
      temperature: 0.1
      action_shuffle_diagnostics: true

  masked_sequence_pred03:
    overrides:
      - +loss.pred_weight=0.3
    control:
      <<: *masked_sequence_control

  masked_sequence_pred05:
    overrides:
      - +loss.pred_weight=0.5
    control:
      <<: *masked_sequence_control

  masked_sequence_pred07:
    overrides:
      - +loss.pred_weight=0.7
    control:
      <<: *masked_sequence_control

  masked_sequence_pred0:
    overrides:
      - +loss.pred_weight=0.0
    control:
      <<: *masked_sequence_control

  control_aligned_pred1:
    overrides:
      - +loss.pred_weight=1.0
      - +loss.aligned_gradient_routing.enabled=true
    control:
      <<: *masked_sequence_control

  # RandGoal repair: within-episode control relations cannot identify a goal
  # that is constant throughout the episode.  Cross-batch action-plan
  # compatibility rewards state information that changes the expert's future
  # decisions, while the aligned rule still gates prediction at the encoder.
  decision_aligned_pred1:
    overrides:
      - +loss.pred_weight=1.0
      - +loss.aligned_gradient_routing.enabled=true
    control:
      <<: *masked_sequence_control
      action_plan_weight: 0.1

  # Mechanism ablation: retain only prediction gradient parallel to the
  # control gradient. This tests whether the softly retained orthogonal part
  # is important rather than merely making the rule more complicated.
  control_parallel_pred1:
    overrides:
      - +loss.pred_weight=1.0
      - +loss.aligned_gradient_routing.enabled=true
      - +loss.aligned_gradient_routing.orthogonal_mode=drop
    control:
      <<: *masked_sequence_control

  # Negative control: preserve the marginal distribution of control
  # gradients but assign each sample another sample's guide direction.
  control_shuffled_pred1:
    overrides:
      - +loss.pred_weight=1.0
      - +loss.aligned_gradient_routing.enabled=true
      - +loss.aligned_gradient_routing.shuffle_control=true
    control:
      <<: *masked_sequence_control

  # Same per-sample prediction-gradient norm as true aligned routing, but the
  # original prediction direction is unchanged. This isolates directional
  # selection from adaptive scalar down-weighting.
  control_norm_matched_scalar_pred1:
    overrides:
      - +loss.pred_weight=1.0
      - +loss.aligned_gradient_routing.enabled=true
      - +loss.aligned_gradient_routing.routing_mode=norm_matched_scalar
    control:
      <<: *masked_sequence_control

  # Another sample supplies the control-gradient axis, but the routed update
  # is rescaled to the exact per-sample norm of true aligned routing.
  control_retention_matched_shuffled_pred1:
    overrides:
      - +loss.pred_weight=1.0
      - +loss.aligned_gradient_routing.enabled=true
      - +loss.aligned_gradient_routing.routing_mode=retention_matched_shuffled
    control:
      <<: *masked_sequence_control
