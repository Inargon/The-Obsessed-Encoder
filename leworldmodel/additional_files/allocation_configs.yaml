# Three new-method arms on the same per-episode coloured-square failure case.
# The published clean, random-control, and unregularized test arms are
# intentionally not run.

epochs: 10
eval_every_n_steps: 2000
pair_every_n_steps: 100
checkpoint_every_n_steps: 500
preview_episodes: 2

common_overrides:
  - data.dataset.name=pusht_expert_train.h5
  - +pixel_tag.mode=video
  - +pixel_tag.size=5

common_eval_overrides:
  - +eval.tag_mode=video
  - +eval.tag_size=5

arms:
  conditional:
    allocation:
      mode: conditional
      variance_target: 0.20
      variance_weight: 1.0
      covariance_weight: 0.01
      local_rank_weight: 0.0

  local_rank:
    allocation:
      mode: local_rank
      variance_weight: 0.0
      covariance_weight: 0.0
      local_rank_target: 8.0
      local_rank_weight: 0.10
      neighbors: 16

  hybrid:
    allocation:
      mode: hybrid
      variance_target: 0.20
      variance_weight: 1.0
      covariance_weight: 0.01
      local_rank_target: 8.0
      local_rank_weight: 0.10
      neighbors: 16
