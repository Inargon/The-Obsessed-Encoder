# Run-name -> hydra overrides for lejepa_minimal.py.
#
# The three arms are written out in full on purpose: the discipline that
# `random_control` differs from `watermarked` in `watermark_repeat` and in
# NOTHING else (and that `clean` carries no watermark keys at all) is enforced
# by additional_files/tests/test_configs.py, not by YAML anchors.
#
# Operating point: ImageNet-1k, 30K steps with the LR cosine laid out over a
# 200K-step horizon (the run stops mid-schedule), upstream-recommended
# lamb/V/proj_dim/lr/bs; evaluation + pair metrics every 2000 steps over the
# full validation split (upstream's own evaluation scope; ~40s per tick).

clean:
  dataset: imagenet1k
  bs: 256
  lr: 0.002
  lamb: 0.02
  proj_dim: 16
  V: 4
  epochs: 1000
  num_workers: 16
  max_steps: 30000
  eval_every_steps: 2000
  lr_horizon: 200000

watermarked:
  dataset: imagenet1k
  bs: 256
  lr: 0.002
  lamb: 0.02
  proj_dim: 16
  V: 4
  epochs: 1000
  num_workers: 16
  max_steps: 30000
  eval_every_steps: 2000
  lr_horizon: 200000
  watermark_opacity: 0.05
  watermark_modulus: 4096
  watermark_bits: 12
  watermark_tile: 32
  origin_anchor: gabor
  random_anchor: true
  watermark_repeat: true

random_control:
  dataset: imagenet1k
  bs: 256
  lr: 0.002
  lamb: 0.02
  proj_dim: 16
  V: 4
  epochs: 1000
  num_workers: 16
  max_steps: 30000
  eval_every_steps: 2000
  lr_horizon: 200000
  watermark_opacity: 0.05
  watermark_modulus: 4096
  watermark_bits: 12
  watermark_tile: 32
  origin_anchor: gabor
  random_anchor: true
  watermark_repeat: false
