# The shipped DINOv3 operating point: the published `vitl_im1k_lin834` recipe
# ("Fast setup", ViT-L/16 on ImageNet-1k), adapted for a single GPU:
#   - dataset_path -> the local parquet IN-1k mirror (ImageNet1kParquet); the
#     watermark knobs ride the DINOV3_WM_* environment (see
#     additional_files/imagenet1k_parquet.py) -- this yaml is watermark-free and
#     identical across the three arms.
#   - batch_size_per_gpu 128 (no grad-accum; total batch == per-GPU batch). LR
#     auto-scales via upstream's native sqrt_wrt_1024 rule: 4 * sqrt(128/1024)
#     ~ 1.41x of the listed peak -- dino run as it prescribes.
#   - optim.epochs 400 == a 500K-iteration LR/WD/momentum schedule horizon
#     (400 * OFFICIAL_EPOCH_LENGTH); the shipped runs stop at DINOV3_MAX_ITER
#     50000, mid-schedule -- the cap and the horizon are decoupled (see the
#     marked block in dinov3/train/train.py).
#   - evaluation.eval_period_iterations 5000: upstream's do_test only dumps a
#     teacher checkpoint; these dumps are the milestones the dense NYU-depth
#     probe evaluates after training.
#   - checkpointing.period 1500, max_to_keep 3: local insurance against a
#     truncated newest checkpoint; upstream's trainer natively resumes from the
#     latest checkpoint in the output dir, so a killed run continues for free.
MODEL:
  META_ARCHITECTURE: SSLMetaArch
  DEVICE: cuda
  WEIGHTS: ''
  DTYPE: float32
compute_precision:
  param_dtype: bf16
  reduce_dtype: fp32
  sharding_strategy: SHARD_GRAD_OP
dino:
  loss_weight: 1.0
  global_ignore_diagonal: true
  head_n_prototypes: 65536
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048
  koleo_loss_weight: 0.1
  koleo_loss_distributed: false
  koleo_topk: 1
  koleo_distributed_replicas: 0
  force_weight_norm: false
ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max:
  - 0.1
  - 0.5
  mask_random_circular_shift: false
  force_masking_even_with_zero_weight: false
  separate_head: true
  head_n_prototypes: 65536
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048
train:
  batch_size_per_gpu: 128
  dataset_path: ImageNet1kParquet:split=TRAIN
  output_dir: ''
  saveckp_freq: 20
  seed: 0
  num_workers: 12
  OFFICIAL_EPOCH_LENGTH: 1250
  monitor_gradient_norm: false
  chunk_schedule: []
  cache_dataset: true
  use_teacher_head: true
  learn_from_teacher_tokens: false
  centering: sinkhorn_knopp
  # Upstream's activation checkpointing (math-identical, ~25% step-time cost).
  # Part of the single-GPU adaptation: iBOT's variable masking gives per-batch
  # activation peaks a heavy tail -- ~76 GiB and a deterministic OOM near
  # iteration 2K on 80 GB cards without it, ~24 GiB with it.
  checkpointing: true
  compile: true
  cudagraphs: false
  cell_augmentation: false
  cell_augmentation_type: hpa
student:
  arch: vit_large
  patch_size: 16
  drop_path_rate: 0.3
  layerscale: 1.0e-05
  patch_drop: 0.0
  pretrained_weights: ''
  ffn_layer: mlp
  ffn_ratio: 4.0
  resume_from_teacher_chkpt: ''
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  norm_layer: layernorm
  n_storage_tokens: 0
  mask_k_bias: false
  in_chans: 3
  pos_embed_type: rope
  pos_embed_rope_base: 100.0
  pos_embed_rope_min_period: null
  pos_embed_rope_max_period: null
  pos_embed_rope_normalize_coords: separate
  pos_embed_rope_shift_coords: null
  pos_embed_rope_jitter_coords: null
  pos_embed_rope_rescale_coords: null
  pos_embed_rope_dtype: bf16
  fp8_enabled: False
  fp8_filter: "blocks"
teacher:
  momentum_teacher: 0.992
  final_momentum_teacher: 1
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 30
  in_chans: 3
distillation:
  enabled: false
  full_cfg_path: ''
  checkpoint_path: ''
multidistillation:
  enabled: false
hrft:
  enabled: false
  checkpoint_path: ''
optim:
  epochs: 400
  optimizer: adamw
  weight_decay: 0.04
  weight_decay_end: 0.4
  lr: 0.001
  warmup_epochs: 10
  min_lr: 1.0e-06
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  dino_head_wd_multiplier: 1.0
  layerwise_decay: 0.9
  multi_tensor_optim: true
  dump_fsdp_weights_path: ''
  adamw_beta1: 0.9
  adamw_beta2: 0.999
crops:
  global_crops_scale:
  - 0.32
  - 1.0
  local_crops_number: 8
  local_crops_scale:
  - 0.05
  - 0.32
  global_crops_size: 224
  local_crops_size: 96
  localcrops_subset_of_globalcrops: false
  share_color_jitter: false
  horizontal_flips: true
evaluation:
  eval_period_iterations: 5000
  low_freq_every: 5
  config_files:
    high_freq: benchmark_high_frequency.yaml
    low_freq: benchmark_low_frequency.yaml
checkpointing:
  period: 1500
  max_to_keep: 3
